<html><head><meta http-equiv="Content-Type" content="text/html; charset=windows-1252">
    <title>Simple Navbar</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        body{
            font-family:'Poppins', sans-serif;
            background-color:#1b2a2f;
        }
        /* Navigation Bar */
        nav{
            background-color:#264653;
            height:50px;
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:0 20px;
        }
        /* Logo */
        .logo{
            color:#e9c46a;
            font-size:22px;
            font-weight:bold;
        }
        /* Menu */
        ul{
            list-style:none;
            display:flex;
        }
        ul li{
            margin-left:20px;
        }
        ul li a{
            text-decoration:none;
            color:#f4f1de;
            font-size:16px;
            transition:0.3s;
        }
        ul li a:hover{
            color:#e76f51;
        }
        /* Content */
        .content{
            text-align:center;
            margin-top:80px;
            color:#f4f1de;
        }
        .content h1{
            color:#e9c46a;
        }
    </style>
    <link rel="preconnect" href="https://fonts.googleapis.com/">
    <link rel="preconnect" href="https://fonts.gstatic.com/" crossorigin="">
    <link href="./navbar simple_files/css2" rel="stylesheet">
</head>
<body>
    <nav>
        <div class="logo">MyWebsite</div>
        <ul>
            <li><a href="file:///C:/Users/johns/Downloads/navbar_5.html#">Home</a></li>
            <li><a href="file:///C:/Users/johns/Downloads/navbar_5.html#">About</a></li>
            <li><a href="file:///C:/Users/johns/Downloads/navbar_5.html#">Services</a></li>
            <li><a href="file:///C:/Users/johns/Downloads/navbar_5.html#">Contact</a></li>
        </ul>
    </nav>
    <div class="content">
        <h1>Welcome to My Website</h1>
        <p>This is a simple navigation bar using HTML and CSS.</p>
    </div>


</body></html>
